spring:
  application:
    name: football

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/football_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

jwt:
  secret: ${JWT_SECRET}
  expirationAccess: 1800000
  expirationRefresh: 172800000

api:
  football:
    key: ${FOOTBALL_API_KEY}
    host: v3.football.api-sports.io

app:
  seed:
    enabled: false